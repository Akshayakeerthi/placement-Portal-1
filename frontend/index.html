<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CampusConnect Application v2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root {
        --ppa-primary: #4f46e5;
        --ppa-secondary: #06b6d4;
        --ppa-soft: #eef2ff;
      }
      body {
        background: #dfe5eb;
        min-height: 100vh;
        color: #1f2937;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(99, 102, 241, 0.15);
        box-shadow: 0 12px 30px rgba(79, 70, 229, 0.08);
        border-radius: 16px;
      }
      .section-title {
        font-weight: 700;
        color: #1e1b4b;
      }
      .table thead th {
        background: var(--ppa-soft);
        color: #312e81;
        border-bottom: 1px solid #c7d2fe;
        font-weight: 600;
      }
      .status-badge {
        border-radius: 999px;
        padding: 0.35rem 0.6rem;
      }
      .top-gradient {
        background: linear-gradient(90deg, var(--ppa-primary), var(--ppa-secondary));
        color: white;
        border-radius: 16px;
      }
      .landing-shell {
        background: #e8edf4;
        border: 1px solid #cfd8e3;
        border-radius: 16px;
      }
      .info-tile, .feature-card {
        background: #f5f7fb;
        border: 1px solid #ccd6e2;
        border-radius: 14px;
        box-shadow: 0 2px 4px rgba(15, 23, 42, 0.06);
      }
      .feature-card h3 {
        font-size: 2.2rem;
        margin-bottom: 0.6rem;
      }
      .info-tile h4 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="app" class="container py-4"></div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script type="module" src="/frontend/js/app.js"></script>
  </body>
</html>
