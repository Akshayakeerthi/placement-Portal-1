{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
<div class="card"><div class="card-body">
  <h4>Student Register Form</h4>
  <form method="post" class="row g-3">
    <div class="col-md-6"><label class="form-label">Username</label><input name="username" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Confirm Password</label><input type="password" name="confirm_password" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Full Name</label><input name="full_name" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
    <div class="col-md-6"><label class="form-label">Department</label><input name="department" class="form-control"></div>
    <div class="col-md-3"><label class="form-label">CGPA</label><input name="cgpa" class="form-control"></div>
    <div class="col-md-3"><label class="form-label">Graduation Year</label><input name="graduation_year" class="form-control"></div>
    <div class="col-12"><label class="form-label">Skills</label><textarea name="skills" class="form-control" rows="2"></textarea></div>
    <div class="col-12"><button class="btn btn-success">Register</button></div>
  </form>
</div></div></div></div>
{% endblock %}
