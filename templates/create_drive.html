{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
  <div class="card shadow-sm"><div class="card-body">
    <h4>Create Placement Drive</h4>
    <form method="post" class="row g-3">
      <div class="col-md-6"><label class="form-label">Job Title</label><input name="job_title" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Application Deadline</label><input type="date" name="application_deadline" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Location</label><input name="location" class="form-control"></div>
      <div class="col-md-6"><label class="form-label">Salary Package</label><input name="salary_package" class="form-control" placeholder="e.g., 8 LPA"></div>
      <div class="col-12"><label class="form-label">Job Description</label><textarea name="job_description" class="form-control" rows="3" required></textarea></div>
      <div class="col-12"><label class="form-label">Eligibility Criteria</label><textarea name="eligibility_criteria" class="form-control" rows="2" required></textarea></div>
      <div class="col-12"><button class="btn btn-success">Submit for Approval</button></div>
    </form>
  </div></div>
</div></div>
{% endblock %}
