{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
<div class="card"><div class="card-body">
  <h4>Company Register Form</h4>
  <form method="post" class="row g-3">
    <div class="col-md-6"><label class="form-label">Username</label><input name="username" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Company Name</label><input name="company_name" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">HR Contact</label><input name="hr_contact" class="form-control"></div>
    <div class="col-12"><label class="form-label">Website</label><input name="website" class="form-control"></div>
    <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
    <div class="col-12"><button class="btn btn-info">Register Company</button></div>
  </form>
</div></div></div></div>
{% endblock %}
