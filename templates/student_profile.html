{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
  <div class="card"><div class="card-body">
    <h4>Update Student Profile</h4>
    <form method="post" class="row g-3">
      <div class="col-md-6"><label class="form-label">Full Name</label><input name="full_name" value="{{ profile.full_name }}" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" value="{{ profile.email }}" class="form-control"></div>
      <div class="col-md-6"><label class="form-label">Department</label><input name="department" value="{{ profile.department }}" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">CGPA</label><input name="cgpa" value="{{ profile.cgpa or '' }}" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">Graduation Year</label><input name="graduation_year" value="{{ profile.graduation_year or '' }}" class="form-control"></div>
      <div class="col-12"><label class="form-label">Skills</label><textarea name="skills" class="form-control">{{ profile.skills }}</textarea></div>
      <div class="col-md-4"><label class="form-label">Placement Status</label>
        <select name="placement_status" class="form-select">
          {% for p in ['seeking','placed'] %}
          <option value="{{ p }}" {% if profile.placement_status == p %}selected{% endif %}>{{ p }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12"><button class="btn btn-primary">Save</button></div>
    </form>
  </div></div>
</div></div>
{% endblock %}
