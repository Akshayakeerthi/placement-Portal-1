{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Applications - {{ drive.job_title }}</h3>
<div class="card"><div class="card-body table-responsive">
<table class="table table-bordered align-middle">
  <tr><th>Student</th><th>Department</th><th>Date</th><th>Status</th><th>Update</th></tr>
  {% for a in applications %}
  <tr>
    <td>{{ a.full_name }}</td><td>{{ a.department }}</td><td>{{ a.application_date[:10] }}</td><td>{{ a.status }}</td>
    <td>
      <form method="post" action="{{ url_for('company_update_application', application_id=a.id) }}" class="d-flex gap-2">
        <select class="form-select form-select-sm" name="status">
          {% for st in ['applied','shortlisted','selected','rejected'] %}
          <option value="{{ st }}" {% if st==a.status %}selected{% endif %}>{{ st }}</option>
          {% endfor %}
        </select>
        <input class="form-control form-control-sm" name="remarks" placeholder="remarks" value="{{ a.remarks or '' }}">
        <button class="btn btn-sm btn-primary">Save</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="5" class="text-center">No applications yet.</td></tr>
  {% endfor %}
</table>
</div></div>
{% endblock %}
